server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到后端容器（Compose 网络内服务名 api，容器端口 8000）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
