# 一次性验收编排。
#
# 运行（在仓库根目录）：
#   docker compose -f docker-compose.verify.yml up --build --abort-on-container-exit verify
#
# verify 服务会构建两端镜像，在容器内：
#   1) 后端 pytest；
#   2) 前端 tsc + vitest + vite 生产构建（在 Node 构建容器内）；
#   3) 启动 API 做五类场景的端到端 HTTP 冒烟 + 多窗口 + 采纳拦截。
# 全部通过退出码 0。verify-api / verify-web 可单独运行单端校验。
services:
  api-base:
    build: ./backend
    image: trapping-api:verify

  web-base:
    # 前端校验需要完整源码与 node 工具链，用独立的校验镜像（不产出运行镜像）。
    build:
      context: ./frontend
      dockerfile: Dockerfile.verify
    image: trapping-web:verify

  verify-web:
    image: trapping-web:verify
    depends_on: [web-base]
    command: ["sh", "-lc", "npm run test && npm run build && echo web-verify-ok"]

  verify:
    image: trapping-api:verify
    depends_on:
      api-base:
        condition: service_started
      web-base:
        condition: service_started
      verify-web:
        condition: service_completed_successfully
    working_dir: /workspace
    entrypoint: ["sh", "-lc"]
    command:
      - |
        set -e
        echo "==> [1/4] 后端单元与接口测试"
        pip install --no-cache-dir pytest httpx
        cd /workspace/backend && python -m pytest -q

        echo "==> [2/4] 前端校验（构建期已在 trapping-web:verify 完成 tsc/vitest/build）"

        echo "==> [3/4] 启动后端服务"
        cd /workspace/backend
        uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        API_PID=$$!
        for _ in $$(seq 1 50); do
          curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1 && break
          sleep 0.3
        done
        curl -sf http://127.0.0.1:8000/api/health | grep -q '"ok"'

        echo "==> [4/4] 端到端接口冒烟"
        python /workspace/verify/verify_e2e.py
        kill $$API_PID 2>/dev/null || true
        echo "✅ compose verify 全部通过"
    volumes:
      - ./backend:/workspace/backend
      - ./verify:/workspace/verify:ro
